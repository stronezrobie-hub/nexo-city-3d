name: Browser smoke test
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-save playwright@1.56.1
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - name: Serve game
        run: |
          python3 -m http.server 4173 --directory dist --bind 127.0.0.1 > /tmp/nexo-server.log 2>&1 &
          sleep 2
      - name: Verify rendering and entering game
        run: node tests/browser-smoke.cjs
      - name: Verify graphics presets, time of day and weather
        run: node tests/graphics-smoke.cjs